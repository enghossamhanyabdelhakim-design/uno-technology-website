<main id="app"><noscript><article style="padding:40px;max-width:760px;margin:auto"><h1>أنواع كاميرات المراقبة: إزاي تختار المناسب</h1><h3>حسب التقنية</h3><ul><li><b>Analog HD (مثل AHD/TVI/CVI):</b> كابل كواكس وجهاز DVR. مناسب لو الكابلات موجودة وعايز تحسّن الصورة بميزانية أقل.</li><li><b>IP:</b> كابل شبكة وجهاز NVR. دقة أعلى ومرونة أكتر، وبتشتغل غالبًا بكابل واحد للصورة والكهرباء (PoE).</li><li><b>لاسلكية:</b> مريحة في التركيب، لكن لازم تغذية كهرباء وإشارة واي فاي ثابتة.</li></ul>
<h3>حسب الشكل</h3><ul><li><b>Bullet:</b> مناسبة للخارج ومدى أبعد، وشكلها واضح كرادع.</li><li><b>Dome:</b> مناسبة للداخل وصعبة الاتجاه على من يحاول يعبث بيها.</li><li><b>Turret:</b> قريبة من الدوم وغالبًا أقل انعكاس ليلًا.</li><li><b>PTZ:</b> بتتحرك وتقرب بالتحكم، مناسبة للمساحات الكبيرة.</li></ul>
<h3>إزاي تقرر</h3><p>حدد المكان (داخلي أو خارجي)، المسافة المطلوب تغطيتها، الإضاءة ليلًا، ووجود كابلات قديمة. استخدم أداة تخطيط الكاميرات في الموقع لتقدير الجهاز والتخزين.</p></article></noscript></main>
