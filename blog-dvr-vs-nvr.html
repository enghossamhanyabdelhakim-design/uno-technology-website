<main id="app"><noscript><article style="padding:40px;max-width:760px;margin:auto"><h1>DVR أم NVR؟ الفرق ببساطة</h1><p><b>DVR</b> بيستقبل صورة من كاميرات Analog HD عن طريق كابل كواكس، والمعالجة بتحصل داخل الجهاز.</p>
<p><b>NVR</b> بيستقبل صورة رقمية من كاميرات IP عبر الشبكة، والكاميرا نفسها بتضغط الفيديو.</p>
<h3>نقاط مهمة</h3><ul><li>عدد القنوات (4 أو 8 أو 16 أو 32) لازم يغطي عدد الكاميرات مع مساحة للتوسع.</li><li>الهارد: استخدم هارد مخصص للمراقبة لأنه معمول لتسجيل 24 ساعة.</li><li>الدقة القصوى للجهاز لازم تساوي أو تزيد على دقة الكاميرات.</li><li>فيه أجهزة هجينة (Hybrid) بتدعم النوعين، مفيدة عند الترقية التدريجية.</li></ul>
<p>مش هتقدر تركب كاميرا IP على DVR عادي، ولا العكس.</p></article></noscript></main>
