<!doctype html><html lang="ar" dir="rtl" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uno store preview</title><meta name="robots" content="noindex"><link rel="stylesheet" href="assets/store-ui.css?v=20261128u">
<style>body{margin:0;background:#15110e;font-family:Cairo,Tajawal,system-ui,sans-serif}html[data-theme=light] body{background:#fffaf6}
.hd{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:#F65A00;color:#fff;font-weight:800}.hd button{min-height:44px;border:0;border-radius:10px;padding:0 14px;font-weight:800}</style></head>
<body><div class="hd"><span>UNO · أونو</span><button id="cb" aria-label="cart">السلة <span id="cc">0</span></button></div><main id="app"></main>
<script>{const q=new URLSearchParams(location.search);if(q.get('seed')){localStorage.removeItem('uno_cart_v1');localStorage.setItem('uno_gov',q.get('gov')||'');}}</script><script src="assets/config.js?v=20261128u"></script><script src="assets/store-rpc.js?v=20261128u"></script><script src="assets/store-i18n.js?v=20261128u"></script><script src="assets/store-api.js?v=20261128u"></script><script src="assets/store-cart.js?v=20261128u"></script><script src="assets/store-category.js?v=20261128u"></script><script src="assets/store-product.js?v=20261128u"></script>
<script>
const q=new URLSearchParams(location.search);UnoI18n.setLang(q.get('lang')||'ar');document.documentElement.dataset.theme=q.get('theme')||'dark';
const cb=document.getElementById('cb'),cc=document.getElementById('cc');cb.onclick=()=>UnoCart.open();
document.addEventListener('uno:cart',e=>cc.textContent=UnoI18n.num(e.detail.count));
(async()=>{
 const page=q.get('page')||'category',app=document.getElementById('app');
 if(page==='product'){await UnoProduct.mount(app,{id:q.get('id')||'p2'});}else UnoCategory.mount(app,{});
 if(q.get('seed')){await new Promise(r=>setTimeout(r,300));for(const id of ['p3','p2']){const d=await UnoStoreAPI.store_variants_get(id),v=d.variants.find(x=>x.stock>0);UnoCart.add({key:v.id,product_id:id,variant_id:v.id,name:d.product.name,variant_label:null,price:v.price,max:v.stock,image:d.product.images[0],qty:id==='p2'?2:1});}}
 if(q.get('cart'))UnoCart.open();
 if(q.get('sheet')){await new Promise(r=>setTimeout(r,300));document.querySelector('.us-fbtn').click();await new Promise(r=>setTimeout(r,800));}
})();
</script></body></html>
