<main id="app"><noscript><article style="padding:40px;max-width:760px;margin:auto"><h1>التحكم في الدخول Access Control: دليل مبسط</h1><p>نظام التحكم في الدخول بيحدد مين يدخل فين وإمتى، ويسجل الدخول والخروج.</p>
<h3>طرق التعريف</h3><ul><li>كارت أو تاج (Proximity).</li><li>بصمة الإصبع.</li><li>التعرف على الوجه.</li><li>كود على لوحة مفاتيح.</li><li>تطبيق الموبايل في بعض الأنظمة.</li></ul>
<h3>الأقفال</h3><ul><li><b>قفل مغناطيسي:</b> قوي ونظيف، وبيتفتح بقطع الكهرباء عنه.</li><li><b>قفل كهربي (Strike):</b> بيركب في إطار الباب.</li><li><b>Motorized:</b> مناسب لبعض الأبواب الخشبية والزجاجية.</li></ul>
<h3>نقطة سلامة مهمة</h3><p>مسارات الهروب لازم تتفتح دايمًا في الطوارئ. ربط النظام بإنذار الحريق وزر الخروج بيحقق ده.</p>
<h3>إدارة الأفراد</h3><p>البرنامج بيسمح بإضافة وإلغاء الصلاحيات وعمل جداول مواعيد وتقارير حضور.</p></article></noscript></main>
