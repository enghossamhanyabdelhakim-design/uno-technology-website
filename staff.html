<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F65A00">
<title>Uno Support | دعم أونو</title><link rel="icon" href="assets/logo-tu.png">
<style>
:root{--o:#F65A00;--ink:#1F2933;--mut:#5B6670;--ln:#E7DED6;--bg:#F6F3F0;--cd:#fff}
@media(prefers-color-scheme:dark){:root{--ink:#eceff3;--mut:#9aa4af;--ln:#2a313a;--bg:#0f1318;--cd:#161b22}}
*{box-sizing:border-box;margin:0}body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);height:100dvh;display:flex;flex-direction:column}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;background:var(--o);color:#fff;cursor:pointer}button.alt{background:transparent;color:var(--o);border:1.5px solid var(--o)}
input{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);color:var(--ink)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--cd);border-bottom:1px solid var(--ln)}header b{flex:1}
#v{flex:1;overflow:auto;padding:12px}.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px}
.th{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:var(--cd);color:var(--ink);border:1px solid var(--ln);margin-bottom:8px;border-radius:14px}.th small{display:block;color:var(--mut);font-weight:400}.th div{flex:1}
.n{background:#dc2626;color:#fff;border-radius:99px;min-width:22px;text-align:center;font-size:12px;padding:1px 6px}
#m{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}.b{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--cd);border:1px solid var(--ln);white-space:pre-wrap;overflow-wrap:anywhere}.b.agent{align-self:flex-start;background:var(--o);color:#fff;border:0}.b.visitor{align-self:flex-end}
form{display:flex;gap:8px;padding:10px;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:max(10px,env(safe-area-inset-bottom))}.er{color:#b42318;margin:8px 0}.hint{color:var(--mut);font-size:13px}
</style></head><body>
<header><b id="ttl">دعم أونو / Uno Support</b><button class="alt" id="bk" style="display:none">&larr;</button><button class="alt" id="lo" style="display:none">خروج / Logout</button></header>
<div id="v"></div>
<script src="assets/config.js"></script>
<script>
(function(){
var C=window.UNO_CFG,S=null,ME=null,cur=null,lastId=0,list=[],prevUnread=0,T=null,V=document.getElementById("v");
function $(i){return document.getElementById(i)}function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function save(){localStorage.setItem("uno_staff",JSON.stringify(S))}
function tok(){if(!S)return Promise.reject(new Error("login"));if(S.exp>Date.now()/1000+60)return Promise.resolve(S.access_token);
 return fetch(C.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:C.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.refresh_token})}).then(function(r){return r.json()}).then(function(j){if(!j.access_token)throw new Error("login");S={access_token:j.access_token,refresh_token:j.refresh_token,exp:j.expires_at,uid:j.user.id,email:j.user.email};save();return S.access_token})}
function api(m,p,b,pf){return tok().then(function(t){var h={apikey:C.key,Authorization:"Bearer "+t,"Content-Type":"application/json"};if(pf)h.Prefer=pf;return fetch(C.url+"/rest/v1/"+p,{method:m,headers:h,body:b?JSON.stringify(b):undefined}).then(function(r){return r.text().then(function(x){if(!r.ok)throw new Error((x&&JSON.parse(x).message)||r.status);return x?JSON.parse(x):null})})})}
function login(){document.title="Uno Support";$("ttl").textContent="دعم أونو / Uno Support";$("lo").style.display=$("bk").style.display="none";V.innerHTML='<div class="card"><h3 style="margin-bottom:10px">تسجيل دخول الموظف / Staff login</h3><input id="e" type="email" placeholder="Email" autocomplete="username" dir="ltr" style="margin-bottom:8px"><input id="p" type="password" placeholder="كلمة السر / Password" autocomplete="current-password" dir="ltr"><p class="er" id="er"></p><button id="go" style="width:100%">دخول / Sign in</button></div>';
 $("go").onclick=function(){$("er").textContent="";fetch(C.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:C.key,"Content-Type":"application/json"},body:JSON.stringify({email:$("e").value.trim(),password:$("p").value})}).then(function(r){return r.json()}).then(function(j){if(!j.access_token)throw new Error("بيانات الدخول غير صحيحة / Wrong login details");S={access_token:j.access_token,refresh_token:j.refresh_token,exp:j.expires_at,uid:j.user.id,email:j.user.email};save();boot()}).catch(function(e){$("er").textContent=e.message})}}
function boot(){api("POST","rpc/has_perm",{m:"chat"}).then(function(ok){if(!ok)throw new Error("هذا الحساب ليس له صلاحية الدعم / This account has no support access");return api("GET","staff_profiles?user_id=eq."+S.uid+"&select=*")}).then(function(r){ME=r[0]||null;if(!ME)return prof();home()}).catch(function(e){S=null;localStorage.removeItem("uno_staff");login();$("er").textContent=e.message})}
function prof(){V.innerHTML='<div class="card"><h3>اسمك اللي هيظهر للعميل / Your name shown to visitors</h3><input id="nm" maxlength="40" style="margin:10px 0"><p class="er" id="er"></p><button id="sv">حفظ / Save</button></div>';$("sv").onclick=function(){var n=$("nm").value.trim();api("POST","staff_profiles",{user_id:S.uid,display_name:n},"return=representation").then(function(r){ME=r[0];home()}).catch(function(e){$("er").textContent=e.message})}}
function beep(){try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.25)}catch(e){}if(navigator.vibrate)navigator.vibrate(200)}
function home(){cur=null;clearInterval(T);$("ttl").textContent=ME.display_name+" · دعم أونو";$("lo").style.display="";$("bk").style.display="none";$("lo").onclick=function(){S=null;localStorage.removeItem("uno_staff");clearInterval(T);login()};
 V.style.padding="12px";V.innerHTML='<div id="tl"></div>';if(window.Notification&&Notification.permission==="default")try{Notification.requestPermission()}catch(e){}
 function load(){api("GET","support_chats?select=*&order=last_at.desc&limit=100").then(function(r){list=r;var u=r.reduce(function(a,c){return a+(c.unread_agent||0)},0);if(u>prevUnread){beep();document.title="("+u+") Uno Support";try{if(window.Notification&&Notification.permission==="granted")new Notification("رسالة جديدة / New message")}catch(e){}}prevUnread=u;if(!u)document.title="Uno Support";
  $("tl").innerHTML=r.length?r.map(function(c){return '<button class="th" data-i="'+c.id+'"><div><b>'+esc(c.name)+'</b><small>'+(c.assigned_name?"مع "+esc(c.assigned_name):"غير مستلمة / Unassigned")+" · "+(c.status==="open"?"مفتوحة":"مقفولة")+"</small></div>"+(c.unread_agent>0?'<span class="n">'+c.unread_agent+"</span>":"")+"</button>"}).join(""):'<p class="hint">مفيش محادثات / No conversations</p>';
  [].forEach.call(document.querySelectorAll(".th"),function(b){b.onclick=function(){cur=list.filter(function(c){return c.id===b.dataset.i})[0];lastId=0;chat()}})}).catch(function(e){if(e.message==="login"){login()}})}
 load();T=setInterval(function(){if(!cur)load()},4000)}
function chat(){clearInterval(T);$("bk").style.display="";$("bk").onclick=home;$("ttl").textContent=cur.name;V.style.padding="0";V.style.display="flex";V.style.flexDirection="column";
 V.innerHTML='<div style="padding:8px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--ln)"><span class="hint" style="flex:1" dir="ltr">'+esc(cur.phone||"")+" "+(cur.assigned_name?"· "+esc(cur.assigned_name):"")+'</span><button class="alt" id="cl" style="padding:6px 12px">'+(cur.assigned_to===S.uid?"تحويل / Release":"استلام / Take")+'</button></div><div id="m"></div><form id="f"><input id="t" maxlength="1000" autocomplete="off" placeholder="اكتب ردك / Type your reply"><button>إرسال</button></form>';
 $("cl").onclick=function(){var mine=cur.assigned_to===S.uid;api("PATCH","support_chats?id=eq."+cur.id,mine?{assigned_to:null,assigned_name:null,assigned_photo:null}:{assigned_to:S.uid,assigned_name:ME.display_name,assigned_photo:ME.photo_url||null},"return=representation").then(function(r){cur=r[0];chat()})};
 function pull(){return api("GET","support_messages?select=*&chat_id=eq."+cur.id+"&id=gt."+lastId+"&order=id.asc&limit=200").then(function(ms){var box=$("m");if(!box)return;ms.forEach(function(m){var d=document.createElement("div");d.className="b "+m.sender;d.textContent=m.body;box.appendChild(d);lastId=Math.max(lastId,m.id)});if(ms.length){box.scrollTop=box.scrollHeight;if(cur.unread_agent>0){cur.unread_agent=0;api("PATCH","support_chats?id=eq."+cur.id,{unread_agent:0},"return=minimal")}}})}
 $("f").onsubmit=function(e){e.preventDefault();var v=$("t").value.trim();if(!v)return;$("t").value="";var p={last_at:new Date().toISOString()};if(!cur.assigned_to){p.assigned_to=S.uid;p.assigned_name=ME.display_name;p.assigned_photo=ME.photo_url||null}api("POST","support_messages",{chat_id:cur.id,sender:"agent",body:v,sender_name:ME.display_name},"return=minimal").then(function(){return api("PATCH","support_chats?id=eq."+cur.id,p,"return=minimal")}).then(function(){if(p.assigned_to){cur.assigned_to=p.assigned_to;cur.assigned_name=p.assigned_name}return pull()}).catch(function(er){alert(er.message)})};
 pull();T=setInterval(pull,3000)}
try{S=JSON.parse(localStorage.getItem("uno_staff")||"null")}catch(e){}
if(S)boot();else login();
})();
</script></body></html>
