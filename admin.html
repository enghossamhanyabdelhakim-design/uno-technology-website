:root{--o:#F65A00;--od:#C94700;--ink:#1F2933;--mut:#5B6670;--ln:#E7DED6;--bg:#F6F3F0;--sbw:288px}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:7px 16px;cursor:pointer;background:#F65A00;color:#fff}
button.sec{background:#fff;color:var(--o);border:1.5px solid var(--o)}button.dg{background:#fff;color:#b42318;border:1.5px solid #f0b4ae}
button.sm{padding:2px 10px;font-size:13px}button:disabled{opacity:.5;cursor:default}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:var(--sbw) 1fr;min-height:100vh;transition:grid-template-columns .2s}
body.mini{--sbw:68px}
#sb{position:sticky;top:0;height:100vh;background:#fff;border-inline-end:1px solid var(--ln);display:flex;flex-direction:column;overflow:hidden;z-index:40}
.sbh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln);min-height:60px}
.sbh img{height:32px}.sbh b{flex:1;font-size:16px;white-space:nowrap}
.sbh .col{background:transparent;color:var(--mut);padding:4px;border-radius:8px;display:flex}
.sbh .col:hover{background:#FFF1E8;color:var(--o)}
#nav{flex:1;overflow:auto;padding:8px}
.grp{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.04em;padding:14px 12px 4px;white-space:nowrap;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:transparent;color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:600}
.ni:hover{background:#FFF1E8;color:var(--o)}.ni.on{background:#FFE9DB;color:var(--od)}
.ni .n{flex:1;white-space:normal;line-height:1.3}.ni .bd{background:var(--o);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
.sub{display:none;padding:2px 0 6px;margin-inline-start:14px;border-inline-start:2px solid var(--ln)}
.sub.open{display:block}
#side{display:block!important;position:static!important;border:0!important;padding:0!important;max-height:none!important;background:transparent!important}
#side button{display:block;width:100%;text-align:start;background:transparent;color:var(--ink);border-radius:8px;padding:5px 12px;font-weight:500;font-size:14px}
#side button.on,#side button:hover{background:#FFF1E8;color:var(--o)}
.sbf{border-top:1px solid var(--ln);padding:10px 12px;font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center}
.sbf .r{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.mini .sbh b,body.mini .ni .n,body.mini .ni .bd,body.mini .grp,body.mini .sub,body.mini .sbf .r{display:none}
body.mini .ni{justify-content:center;padding:10px}body.mini .sbh{justify-content:center}body.mini .sbh img{display:none}
.mn{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--ln);display:flex;gap:10px;align-items:center;padding:10px 16px;min-height:60px}
.top h1{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hb{display:none;background:transparent;color:var(--ink);padding:6px;border-radius:10px}
.rb{background:#FFF1E8;color:var(--od);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700}
#ctools{display:none;gap:8px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--ln);align-items:center}
body.m-content #ctools{display:flex}
.note{background:#FFF4E5;border:1px solid #F5CF9B;border-radius:12px;padding:10px 14px;margin:14px 16px 0;font-size:13px;display:none}
body.m-content .note{display:block}
.main{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:18px;margin:16px;min-width:0}
.main h2{font-size:20px;margin-bottom:12px}
fieldset{border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0;min-width:0}
legend{font-weight:700;color:var(--o);padding:0 8px;font-size:14px}
label.f{display:block;margin:8px 0}label.f>span{display:block;font-size:13px;color:var(--mut);font-weight:600}
input[type=text],input[type=url],input[type=email],input[type=number],input[type=search],select,textarea{width:100%;font:inherit;padding:8px 12px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}textarea.big{min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair .l{font-size:12px;color:var(--mut)}
details.it{border:1px solid var(--ln);border-radius:12px;margin:8px 0;background:#FCFAF8}
details.it>summary{cursor:pointer;padding:8px 12px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
details.it>summary .t{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.it>.in{padding:6px 12px 12px}
.img{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.img img{width:84px;height:84px;object-fit:contain;border:1px solid var(--ln);border-radius:10px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px}
.img .ctl{flex:1;min-width:200px}
.dirty{color:#b42318;font-size:13px;font-weight:600}.ok{color:#067647;font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:12px 0}
.card{border:1px solid var(--ln);border-radius:14px;padding:14px;background:#FCFAF8}.card b{display:block;font-size:26px;color:var(--od);line-height:1.2}.card span{font-size:13px;color:var(--mut)}
.sup{display:grid;grid-template-columns:260px 1fr;gap:12px;min-height:420px}.sup-l{border:1px solid var(--ln);border-radius:12px;overflow:auto;max-height:70vh;background:#fff}.sup-i{display:block;width:100%;text-align:start;background:none;color:inherit;border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:10px 12px;position:relative}.sup-i.on{background:#fff4ec}.sup-i small{display:block;color:#667;font-weight:400;margin-top:2px}.sup-n{position:absolute;inset-inline-end:10px;top:10px;background:var(--o);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px}.sup-c{border:1px solid var(--ln);border-radius:12px;display:flex;flex-direction:column;background:#fff;max-height:70vh}.sup-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln)}.sup-h small{display:block;color:#667}.sup-m{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:240px}.sup-b{max-width:78%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f5}.sup-b.agent{align-self:flex-end;background:var(--o);color:#fff}.sup-f{display:flex;gap:8px;padding:10px;border-top:1px solid var(--ln)}.sup-f input{flex:1;min-width:0}@media(max-width:700px){.sup{grid-template-columns:1fr}.sup-l{max-height:200px}}
html[data-theme=dark] .sup-l,html[data-theme=dark] .sup-c{background:#161b22}html[data-theme=dark] .sup-b{background:#222a35}html[data-theme=dark] .sup-i.on{background:#2a2018}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}.tb input,.tb select{width:auto;flex:1;min-width:140px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--ln);vertical-align:middle}th{background:#FCFAF8;font-size:12px;color:var(--mut);white-space:nowrap}tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:99px;padding:0 10px;font-size:12px;font-weight:700;background:#eee;color:#444}.pill.g{background:#DCFAE6;color:#067647}.pill.r{background:#FEE4E2;color:#b42318}.pill.o{background:#FFF1E8;color:var(--od)}
.thumb{width:44px;height:44px;border-radius:8px;border:1px solid var(--ln);object-fit:cover;background:#fff}
.ph{display:flex;gap:8px;flex-wrap:wrap}.ph .pi{position:relative}.ph .pi img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--ln)}.ph .pi button{position:absolute;top:2px;inset-inline-end:2px;padding:0 7px}
.kv{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin:4px 0}
#ov{display:none;position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:35}
#dlg{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:60;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
#dlg .box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:760px;margin:auto}
.pw{font-family:ui-monospace,Menlo,monospace;background:#FFF4E5;border:1px dashed #F5CF9B;border-radius:10px;padding:8px 12px;direction:ltr;user-select:all;word-break:break-all}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 #sb{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(86vw,300px);transform:translateX(100%);transition:transform .22s;box-shadow:0 0 30px rgba(0,0,0,.2)}
 [dir=ltr] #sb{transform:translateX(-100%)}
 body.nav-open #sb{transform:none}body.nav-open #ov{display:block}
 #hb{display:flex}.sbh .col{display:none}
 body.mini{--sbw:264px}body.mini .sbh b,body.mini .ni .n,body.mini .ni .bd,body.mini .grp,body.mini .sbf .r{display:revert}body.mini .sub.open{display:block}body.mini .ni{justify-content:flex-start;padding:9px 12px}body.mini .sbh img{display:block}
 .main{margin:10px;padding:14px}.pair{grid-template-columns:1fr}.kv{grid-template-columns:1fr 1fr auto}
 .top{padding:8px 12px}
}
@media(max-width:560px){.top .rb{display:none}.top{gap:8px}.top h1{font-size:14.5px;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}}
h2,.card,td{overflow-wrap:anywhere}
