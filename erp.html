<style>html,body{margin:0;background:#FAF8F5}.erp-login{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(120% 60% at 50% 0%,#FFE9DA 0%,#FAF8F5 55%);color:#191A1E;font-family:Alexandria,system-ui,sans-serif;padding:16px}.erp-login .el-side{display:none}.erp-login form{width:100%;max-width:380px;background:#fff;border:1px solid #ECE8E1;border-radius:22px;padding:26px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 40px rgba(246,90,0,.10);animation:elr .5s cubic-bezier(.2,.8,.2,1) both}@keyframes elr{from{opacity:0;transform:translateY(10px)}}.erp-login form img{height:52px;width:auto;align-self:center;margin-bottom:4px}.erp-login b{font-size:20px;font-weight:800;text-align:center}.erp-login span{color:#5D6168;font-size:13px;text-align:center}.erp-login .pw{position:relative;display:flex}.erp-login .pw input{flex:1}.erp-login .pw i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#8A8F96;font-style:normal;font-size:12px;font-weight:700}.erp-login input{padding:13px 14px;border-radius:12px;border:1px solid #ECE8E1;background:#fff;color:#191A1E;font:inherit;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}.erp-login input:focus{border-color:#F65A00;box-shadow:0 0 0 3px rgba(246,90,0,.15)}.erp-login button[type=submit]{padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#F65A00,#FF8A3D);color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer}.erp-login small{color:#C62828;min-height:1em;text-align:center}.erp-login .el-note{background:#FFF4EC;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#7A3A00;text-align:start}@media(min-width:980px){.erp-login{grid-template-columns:1fr 1fr;padding:0}.erp-login .el-side{display:flex;flex-direction:column;justify-content:center;gap:14px;align-self:stretch;padding:64px;color:#fff;background:linear-gradient(150deg,#F65A00,#FF8A3D);position:relative;overflow:hidden}.erp-login .el-side:after{content:"";position:absolute;inset-inline-start:-120px;bottom:-120px;width:380px;height:380px;border-radius:50%;border:44px solid rgba(255,255,255,.12);box-shadow:0 0 0 44px rgba(255,255,255,.06)}.erp-login .el-side img{height:54px;width:auto;align-self:flex-start;background:#fff;border-radius:14px;padding:8px 12px;position:relative}.erp-login .el-side h2{margin:0;font-size:30px;font-weight:800;position:relative}.erp-login .el-side p{margin:0;opacity:.92;font-size:15px;max-width:40ch;position:relative}.erp-login .el-side .mods{display:flex;gap:8px;flex-wrap:wrap;position:relative}.erp-login .el-side .mods em{font-style:normal;background:rgba(255,255,255,.18);border-radius:99px;padding:6px 14px;font-size:13px}}</style>
<style>@media(max-width:979px){.erp-login{grid-template-columns:minmax(0,1fr)}.erp-login form{box-sizing:border-box;min-width:0;max-width:min(380px,100%)}}</style>
