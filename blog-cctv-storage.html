<main id="app"><noscript><article style="padding:40px;max-width:760px;margin:auto"><h1>كام تخزين محتاجه لكاميرات المراقبة؟</h1><p>حجم التسجيل بيتحدد من 4 حاجات: عدد الكاميرات، الدقة، نوع الضغط (H.265 أوفر من H.264)، وعدد الأيام المطلوب الاحتفاظ بيها.</p>
<h3>قاعدة تقريبية</h3><p>كل ميجابت/ث من تدفق الفيديو المستمر بيستهلك حوالي 10.8 جيجابايت في اليوم. اضرب في عدد الكاميرات وعدد الأيام.</p>
<h3>طرق التوفير</h3><ul><li>تسجيل عند الحركة بدل التسجيل المستمر.</li><li>استخدام H.265 لو الجهاز بيدعمه.</li><li>تقليل معدل الإطارات في الأماكن اللي مفيهاش حركة سريعة.</li></ul>
<p>الأرقام فعليًا بتختلف حسب المشهد وإعدادات الكاميرا، فزوّد هامش أمان. أداة التخطيط في الموقع بتحسب لك تقدير مبدئي.</p></article></noscript></main>
