<main id="app"><noscript><article style="padding:40px;max-width:760px;margin:auto"><h1>أنظمة إنذار الحريق: الأساسيات</h1><p>نظام إنذار الحريق بيكشف الدخان أو الحرارة وينبه الموجودين بدري. وهو نظام سلامة، فلازم يتصمم ويتركب حسب اشتراطات الدفاع المدني وكود البلد.</p>
<h3>المكونات</h3><ul><li>لوحة التحكم (Fire Alarm Panel).</li><li>كواشف دخان وكواشف حرارة.</li><li>أزرار إنذار يدوية.</li><li>سارينات ولمبات تنبيه.</li><li>بطاريات احتياطية للكهرباء.</li></ul>
<h3>تقليدي أم عنواني؟</h3><p><b>التقليدي</b> بيقسم المبنى لمناطق (Zones)، وأنسب للأماكن الصغيرة. <b>العنواني (Addressable)</b> بيحدد مكان كل كاشف بالظبط، وأنسب للمباني الكبيرة.</p>
<h3>الصيانة</h3><p>الاختبار الدوري للكواشف والبطاريات ضروري. النظام اللي مش مصان ممكن ميشتغلش وقت الحاجة.</p>
<p>اطلب دايمًا مراجعة التصميم من جهة مختصة قبل التنفيذ.</p></article></noscript></main>
