<!doctype html><html lang="ar" dir="rtl" data-theme="dark"><head><meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><script>if(window.top!==window.self){document.documentElement.style.display="none"}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uno store (next)</title><meta name="robots" content="noindex"><link rel="stylesheet" href="assets/store-ui.css?v=20261128u"><link rel="stylesheet" href="assets/store-discovery.css?v=20261128u">
<style>body{margin:0;background:#15110e;font-family:Cairo,Tajawal,system-ui,sans-serif}html[data-theme=light] body{background:#fffaf6}
.hd{flex-wrap:wrap;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:#F65A00;color:#fff;font-weight:800}.hd button{min-height:44px;border:0;border-radius:10px;padding:0 14px;font-weight:800}#app>:not(.us-wrap){box-sizing:border-box;max-width:1280px;margin:0 auto;padding:16px}</style></head>
<body><div class="hd"><span>أونو</span><div id="srch" style="flex:1 1 100%;order:3;max-width:none"></div><span style="display:flex;gap:8px"><button id="wb">المفضلة <span id="wc">٠</span></button><button id="cb" aria-label="السلة">السلة <span id="cc">0</span></button></span></div><main id="app" class="us"></main><section id="rec" class="us" style="max-width:1280px;margin:0 auto;padding:0 16px 100px" hidden></section><aside id="wp"></aside><div id="tray"></div>
<script>{const q=new URLSearchParams(location.search);if(q.get('seed')){localStorage.removeItem('uno_cart_v1');localStorage.setItem('uno_gov',q.get('gov')||'');}}</script><script src="assets/config.js?v=20261128u"></script><script src="assets/store-rpc.js?v=20261128u"></script><script src="assets/store-i18n.js?v=20261128u"></script><script src="assets/store-api.js?v=20261128u"></script><script src="assets/store-cart.js?v=20261128u"></script><script src="assets/store-category.js?v=20261128u"></script><script src="assets/store-product.js?v=20261128u"></script><script src="assets/store-404.js?v=20261128u"></script><script src="assets/store-discovery.js?v=20261128u"></script>
<script>
const q=new URLSearchParams(location.search);UnoStore.setLang(q.get('lang')||'ar');if(q.get('wl')){localStorage.setItem('uno_wishlist_v1',JSON.stringify(['p3','p7','p9']));localStorage.setItem('uno_compare_v1',JSON.stringify(['p1','p6','p11']));localStorage.setItem('uno_recent_v1',JSON.stringify(['p2','p5','p8','p4']))}document.documentElement.dataset.theme=q.get('theme')||'dark';
document.addEventListener('uno:checkout',()=>{location.href='checkout.html'});
const cb=document.getElementById('cb'),cc=document.getElementById('cc');cb.onclick=()=>UnoCart.open();
document.addEventListener('uno:cart',e=>cc.textContent=UnoI18n.num(e.detail.count));
UnoStore.mountSearch(document.getElementById('srch'),{productUrl:p=>'?page=product&id='+p.id});const P=UnoStore.mountWishlistPanel(document.getElementById('wp'));document.getElementById('wb').onclick=P.toggle;UnoStore.mountCompareTray(document.getElementById('tray'),{onOpen:()=>location.search='?page=compare'});UnoStore.mountRecent(document.getElementById('rec'));const wc=()=>document.getElementById('wc').textContent=UnoI18n.num(UnoStore.wishlist.ids().length);wc();document.addEventListener('uno:store-state',wc);
(async()=>{
 const page=q.get('page')||'category',app=document.getElementById('app');
 if(page==='404'){UnoNotFound.mount(app,{});}else if(page==='product'){await UnoProduct.mount(app,{id:q.get('id')||'p2'});}else if(page==='wishlist')UnoStore.mountWishlistPage(app);else if(page==='compare')UnoStore.mountComparePage(app);else UnoCategory.mount(app,{});
 if(q.get('seed')){await new Promise(r=>setTimeout(r,300));for(const id of ['p3','p2']){const d=await UnoStoreAPI.store_variants_get(id),v=d.variants.find(x=>x.stock>0);UnoCart.add({key:v.id,product_id:id,variant_id:v.id,name:d.product.name,variant_label:null,price:v.price,max:v.stock,image:d.product.images[0],qty:id==='p2'?2:1});}}
 if(q.get('panel'))P.open();if(q.get('qv'))setTimeout(()=>UnoStore.openQuick(q.get('qv')),500);if(q.get('cart'))UnoCart.open();
 if(q.get('sheet')){await new Promise(r=>setTimeout(r,300));document.querySelector('.us-fbtn').click();await new Promise(r=>setTimeout(r,800));}
})();
</script></body></html>
