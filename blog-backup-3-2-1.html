<main id="app"><noscript><article style="padding:40px;max-width:760px;margin:auto"><h1>النسخ الاحتياطي: قاعدة 3-2-1</h1><p>الهارد ممكن يبوظ، والجهاز ممكن يتسرق، والفيروس ممكن يشفّر ملفاتك. النسخ الاحتياطي هو الحل.</p>
<h3>قاعدة 3-2-1</h3><ul><li><b>3</b> نسخ من بياناتك (الأصل + نسختين).</li><li><b>2</b> نوع تخزين مختلف (مثلًا هارد خارجي وجهاز تخزين شبكي).</li><li><b>1</b> نسخة خارج المكان (سحابية أو في موقع تاني).</li></ul>
<h3>نصائح</h3><ul><li>أتمت النسخ بدل ما تعتمد على الذاكرة.</li><li>جرّب استرجاع ملف بشكل دوري عشان تتأكد إن النسخة سليمة.</li><li>الشركات محتاجة سياسة واضحة: إيه اللي يتحفظ وكل قد إيه.</li></ul></article></noscript></main>
