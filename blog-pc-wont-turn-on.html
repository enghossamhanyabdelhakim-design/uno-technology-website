<main id="app"><noscript><article style="padding:40px;max-width:760px;margin:auto"><h1>الكمبيوتر مش بيشتغل؟ قائمة فحص قبل الصيانة</h1><p>قبل ما تفترض إن الجهاز باظ، جرب دول بالترتيب.</p>
<h3>الكهرباء أولًا</h3><ul><li>جرب مقبس تاني وكابل طاقة تاني.</li><li>تأكد إن مفتاح الباور الخلفي للـ PSU على وضع التشغيل.</li><li>في اللابتوب: جرب بدون بطارية بالشاحن فقط، وتأكد من الشاحن.</li></ul>
<h3>الشاشة</h3><p>أحيانًا الجهاز شغال والمشكلة في الشاشة أو الكابل. جرب شاشة أو كابل مختلف.</p>
<h3>الأصوات والمراوح</h3><p>لو المراوح بتلف ومفيش صورة، المشكلة غالبًا في الرام أو كارت الشاشة. فك الرام وركبها تاني بحرص.</p>
<h3>فصل الملحقات</h3><p>افصل كل الـ USB والكروت الإضافية وشغّل بالحد الأدنى.</p>
<h3>رسائل الخطأ</h3><p>سجّل أي رسالة أو عدد صفرات (Beep) لأن دليل اللوحة الأم بيفسرها.</p>
<p>لو لسه مش شغال، متفتحش مصدر الطاقة بنفسك. فيه جهد خطير حتى وهو مفصول.</p></article></noscript></main>
